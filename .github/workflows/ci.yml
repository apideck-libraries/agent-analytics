name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 dropped in 0.12: no globalThis.crypto by default (needs 19+),
        # and it reached end of life in April 2025.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

      # Run separately so a composition failure is legible as one. Every bug
      # found in this library after the unit suite went green was a layer
      # boundary problem — each part correct alone, contradicting the next.
      # "unit tests pass, integration fails" is the signal worth surfacing.
      - name: Integration — composed stack and cross-layer invariants
        run: npm run test:integration
